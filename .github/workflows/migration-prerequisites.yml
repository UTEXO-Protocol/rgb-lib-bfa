name: Contract and snapshot prerequisites

on:
  pull_request:
    branches: [bfa, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-wallet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        features: [wallet, bitcoind, electrum_validation]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.0'
          components: rustfmt
          rustflags: ''
          cache: false
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test offline wallet and migration boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FEATURES" = wallet ]; then
            cargo test --locked --no-default-features --features wallet --lib -- --test-threads=1
          elif [ "$FEATURES" = bitcoind ]; then
            # These tests use the online-capable database but no network service.
            cargo test --locked --no-default-features --features bitcoind --lib migration_prerequisites -- --test-threads=1
            # EVM request-shape and response tests use only a local mock HTTP server.
            cargo test --locked --no-default-features --features bitcoind --lib api::evm::tests -- --test-threads=1
          else
            # Wallet-less validation must remain independent of wallet/storage features.
            cargo test --locked --no-default-features --features electrum_validation --lib -- --test-threads=1
          fi

  funded-sweeps:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      COMPOSE_PROJECT_NAME: rgb-financial-ci
      RGB_FUNDING_TEST_EXTERNAL: '1'
      RGB_FUNDING_TEST_RPC_URL: http://127.0.0.1:18443
      RGB_FUNDING_TEST_RPC_USER: user
      RGB_FUNDING_TEST_RPC_PASSWORD: default_password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.94.0'
          rustflags: ''
          cache: false
      - name: Start isolated Bitcoin regtest fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f tests/compose.yaml up -d bitcoind
          python3 - <<'PY'
          import base64, json, os, time, urllib.request
          token = base64.b64encode((os.environ['RGB_FUNDING_TEST_RPC_USER'] + ':' + os.environ['RGB_FUNDING_TEST_RPC_PASSWORD']).encode()).decode()
          def rpc(method):
              request = urllib.request.Request(os.environ['RGB_FUNDING_TEST_RPC_URL'], json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': method, 'params': []}).encode(), {'Authorization': 'Basic ' + token, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=5) as response:
                  result = json.load(response)
              assert result.get('error') is None
              return result['result']
          deadline = time.monotonic() + 100
          while True:
              try:
                  assert rpc('getblockchaininfo')['chain'] == 'regtest', 'refusing a non-regtest fixture'
                  indexes = rpc('getindexinfo')
                  if indexes.get('txindex', {}).get('synced') and indexes.get('basic block filter index', {}).get('synced'):
                      break
              except (OSError, ValueError):
                  if time.monotonic() >= deadline:
                      raise
              if time.monotonic() >= deadline:
                  raise RuntimeError('regtest indexes did not become ready')
              time.sleep(1)
          PY
      - name: Test durable confirmed sweeps
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features bitcoind --lib prepared_sweep -- --test-threads=1
      - name: Record fixture logs on failure
        if: failure()
        run: docker compose -f tests/compose.yaml logs --no-color bitcoind
      - name: Remove this runner's fixture
        if: always()
        run: docker compose -f tests/compose.yaml down -v
