name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.3.0-beta.7)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve release source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and resolve immutable source
        id: source
        env:
          VERSION_INPUT: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          VERSION="v${VERSION_INPUT#v}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected a release version such as v0.3.0-beta.7' >&2
            exit 1
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$SOURCE_SHA"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-uniffi:
    name: Build uniffi (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: warp-ubuntu-latest-x64-4x
            lib_name: librgblibuniffi.so
          - target: aarch64-unknown-linux-gnu
            os: warp-ubuntu-latest-arm64-4x
            lib_name: librgblibuniffi.so
          - target: aarch64-apple-darwin
            os: warp-macos-26-arm64-6x
            lib_name: librgblibuniffi.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build uniffi library
        working-directory: bindings/uniffi
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-${{ matrix.target }}
          path: bindings/uniffi/target/${{ matrix.target }}/release/${{ matrix.lib_name }}
          retention-days: 5

  release:
    name: Create Release
    needs: [prepare, build-uniffi]
    runs-on: warp-ubuntu-latest-x64-4x
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            if [ -d "artifacts/uniffi-$target" ]; then
              cd artifacts/uniffi-$target
              zip -r "../../release-assets/rgb-lib-uniffi-$target.zip" .
              cd ../..
            fi
          done
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'alpha') || contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'rc') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-bindings:
    name: Trigger Go bindings rebuild
    needs: [prepare, release]
    runs-on: warp-ubuntu-latest-x64-4x

    steps:
      - name: Trigger rgb-lib-go workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RGB_LIB_GO_PAT }}
          repository: UTEXO-Protocol/rgb-lib-go
          event-type: rgb-lib-bfa-release
          client-payload: |
            {
              "version": "${{ needs.prepare.outputs.version }}",
              "source_repo": "rgb-lib-bfa",
              "branch": "release/bfa"
            }

  trigger-mobile-bindings:
    name: Trigger ${{ matrix.repository }} BFA release
    needs: [prepare, release]
    if: vars.BFA_MOBILE_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repository: [rgb-lib-kotlin, rgb-lib-swift]
    steps:
      - name: Dispatch the same source commit to both platforms
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BFA_BINDINGS_DISPATCH_TOKEN }}
          repository: UTEXO-Protocol/${{ matrix.repository }}
          event-type: rgb-lib-bfa-release
          client-payload: |
            {
              "version": "${{ needs.prepare.outputs.version }}-bfa",
              "source_sha": "${{ needs.prepare.outputs.source_sha }}",
              "source_repository": "UTEXO-Protocol/rgb-lib-bfa"
            }
