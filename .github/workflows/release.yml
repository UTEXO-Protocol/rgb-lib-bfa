name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.3.0-beta.7)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-uniffi:
    name: Build uniffi (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib_name: librgblibuniffi.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            lib_name: librgblibuniffi.so
          - target: aarch64-apple-darwin
            os: macos-latest
            lib_name: librgblibuniffi.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build uniffi library
        working-directory: bindings/uniffi
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-${{ matrix.target }}
          path: bindings/uniffi/target/${{ matrix.target }}/release/${{ matrix.lib_name }}
          retention-days: 5

  release:
    name: Create Release
    needs: [build-uniffi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Ensure v prefix
          VERSION="${VERSION#v}"
          VERSION="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            if [ -d "artifacts/uniffi-$target" ]; then
              cd artifacts/uniffi-$target
              zip -r "../../release-assets/rgb-lib-uniffi-$target.zip" .
              cd ../..
            fi
          done
          echo "=== Release assets ==="
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-bindings:
    name: Trigger Go bindings rebuild
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          VERSION="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger rgb-lib-go workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RGB_LIB_GO_PAT }}
          repository: UTEXO-Protocol/rgb-lib-go
          event-type: rgb-lib-bfa-release
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "source_repo": "rgb-lib-bfa",
              "branch": "release/bfa"
            }
